name: Update incidents

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-incidents
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Collect new incidents
        run: python3 scripts/collect.py
      - name: Commit if the data changed
        run: |
          python3 -c "import json; json.load(open('data/incidents.json'))"
          git config user.name "cyber-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update incidents"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
